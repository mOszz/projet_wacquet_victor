<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <!-- Registration form -->
    <section id="registerSection" class="card">
      <h1>Créer un compte</h1>

      <form id="registerForm" novalidate>

        <div class="form-group">
          <label for="login">Login</label>
          <input type="text" id="login" name="login" required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmation du mot de passe</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>

        <div class="form-group">
          <label for="lastName">Nom</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
          <label for="firstName">Prénom</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="address">Adresse</label>
          <input type="text" id="address" name="address" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Téléphone</label>
          <input type="text" id="phone" name="phone" required>
        </div>

        <div class="form-group">
          <label for="birthDate">Date de naissance</label>
          <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <!-- Error message area -->
        <p id="errorMessage" class="error-message" role="alert"></p>

        <button type="submit" class="submit-btn">S'inscrire</button>

      </form>
    </section>

    <!-- Summary page, hidden until successful submission -->
    <section id="summarySection" class="card hidden">
      <h1>Récapitulatif de l'inscription</h1>

      <dl id="summaryList" class="summary-list"></dl>

      <button id="backButton" class="submit-btn">Retour</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
