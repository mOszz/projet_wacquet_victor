<header class="site-header">
  <div class="container">
    <p class="kicker"><span aria-hidden="true">♻</span> pollution_tracker</p>
    <h1>Pollution Tracker</h1>
    <p class="lead">Signalez et suivez les pollutions repérées près de chez vous.</p>

    <nav class="tabs" aria-label="Sections">
      <a
        class="tab"
        routerLink="/pollutions"
        routerLinkActive
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        Pollutions
      </a>
      <a class="tab" routerLink="/pollutions/new" routerLinkActive ariaCurrentWhenActive="page">
        Déclarer une pollution
      </a>
      <a class="tab" routerLink="/register" routerLinkActive ariaCurrentWhenActive="page">
        Créer un compte
      </a>
    </nav>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">♻ Pollution Tracker · Ensemble, protégeons notre environnement</div>
</footer>
