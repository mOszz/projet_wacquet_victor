<aside class="result" role="status" aria-labelledby="register-result-title">
  <h2 id="register-result-title">Bienvenue, {{ user.firstName }} !</h2>
  <p class="intro">Votre compte a bien été créé.</p>
  <dl>
    <dt>N° de compte</dt>
    <dd class="mono">{{ user.id }}</dd>
    <dt>Identifiant</dt>
    <dd>{{ user.login }}</dd>
    <dt>Nom</dt>
    <dd>{{ user.firstName }} {{ user.lastName }}</dd>
    <dt>E-mail</dt>
    <dd>{{ user.email }}</dd>
    <dt>Créé le</dt>
    <dd>{{ user.createdAt | date: 'medium' }}</dd>
  </dl>
</aside>
